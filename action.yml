name: PR Change Verifier
description: Report existing test coverage for lines added in a pull request.
author: PR Change Verifier
inputs:
  github-token:
    description: Token used to read pull request files and create or update its report comment.
    required: true
  pr-number:
    description: Optional pull request number override for trusted workflow_dispatch runs.
    required: false
    default: ""
  lcov-file:
    description: Path to an LCOV coverage file generated by the repository's existing test suite.
    required: true
  fail-on-uncovered:
    description: Fail the action when at least one changed line is measured but uncovered.
    required: false
    default: "false"
  comment:
    description: Create or update a summary comment on the pull request.
    required: false
    default: "true"
  min-coverage:
    description: Minimum measured changed-line coverage percentage required for success (0-100). Leave empty to disable.
    required: false
    default: ""
  exclude-paths:
    description: Comma- or newline-separated glob patterns for files to omit from the report.
    required: false
    default: ""
outputs:
  covered-lines:
    description: Number of added lines recorded as covered.
    value: ${{ steps.verify.outputs.covered-lines }}
  uncovered-lines:
    description: Number of added lines recorded as uncovered.
    value: ${{ steps.verify.outputs.uncovered-lines }}
  unmeasured-lines:
    description: Number of added lines without matching coverage data.
    value: ${{ steps.verify.outputs.unmeasured-lines }}
  excluded-lines:
    description: Number of added lines excluded by configured file patterns.
    value: ${{ steps.verify.outputs.excluded-lines }}
  changed-files:
    description: Number of changed source files with added lines included in the report.
    value: ${{ steps.verify.outputs.changed-files }}
  coverage:
    description: Measured changed-line coverage percentage, or n/a if no lines were measurable.
    value: ${{ steps.verify.outputs.coverage }}
  report:
    description: JSON-serialized full report, including per-file statistics.
    value: ${{ steps.verify.outputs.report }}
runs:
  using: composite
  steps:
    - name: Analyze pull request changes
      id: verify
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_LCOV_FILE: ${{ inputs.lcov-file }}
        INPUT_FAIL_ON_UNCOVERED: ${{ inputs.fail-on-uncovered }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_MIN_COVERAGE: ${{ inputs.min-coverage }}
        INPUT_EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
      run: node "$GITHUB_ACTION_PATH/src/index.js"
