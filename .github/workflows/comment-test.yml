name: Trusted comment integration test

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number to receive the verifier report.
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-report:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests and generate LCOV
        run: npx --yes c8@10.1.3 --reporter=lcov --reporter=text npm test

      - name: Publish or update the PR report
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ inputs.pr-number }}
          lcov-file: coverage/lcov.info
          comment: "true"
