name: Trusted PR coverage report

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

jobs:
  publish-report:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate workflow run and pull request
        id: validate
        uses: actions/github-script@v7
        with:
          script: |
            const eventRun = context.payload.workflow_run;
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo,
              run_id: eventRun.id,
            });
            if (run.event !== "pull_request" || run.conclusion !== "success") {
              throw new Error("Only successful pull_request workflow runs may publish reports.");
            }

            const associatedPull = run.pull_requests?.find(
              (pull) => pull.head?.sha === run.head_sha
            );
            if (!associatedPull) {
              throw new Error("The workflow run is not associated with a matching pull request head.");
            }

            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: associatedPull.number,
            });
            if (
              pull.base.repo.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
              pull.head.sha !== run.head_sha
            ) {
              core.notice("Skipping a stale report because the pull request head has changed.");
              core.setOutput("should-report", "false");
              return;
            }

            const { data: artifactList } = await github.rest.actions.listWorkflowRunArtifacts({
              ...context.repo,
              run_id: run.id,
              per_page: 100,
            });
            const matchingArtifacts = artifactList.artifacts.filter(
              (artifact) => artifact.name === "pr-change-verifier-lcov",
            );
            if (matchingArtifacts.length !== 1) {
              throw new Error("Expected exactly one LCOV artifact from the triggering workflow run.");
            }
            const artifact = matchingArtifacts[0];
            if (artifact.expired || artifact.size_in_bytes > 20 * 1024 * 1024) {
              throw new Error("The LCOV artifact is expired or exceeds the 20 MiB safety limit.");
            }

            core.setOutput("should-report", "true");
            core.setOutput("pr-number", String(pull.number));
            core.info(`Validated successful workflow run ${run.id} for PR #${pull.number}.`);

      - name: Download coverage from the exact PR workflow run
        if: steps.validate.outputs.should-report == 'true'
        uses: actions/download-artifact@v4
        with:
          name: pr-change-verifier-lcov
          path: coverage
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish or update the PR report
        if: steps.validate.outputs.should-report == 'true'
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ steps.validate.outputs.pr-number }}
          lcov-file: coverage/lcov.info
          comment: "true"
